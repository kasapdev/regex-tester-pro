name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all JS files
        run: |
          set -e
          find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
